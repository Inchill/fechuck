<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#fafaf8"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#111827">用 Worker Cron 触发 GitHub Actions</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Cloudflare 负责定时，GitHub Actions 负责执行</text>

  <!-- 参与者 -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="50" y="94" width="180" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="140" y="124" fill="#78350f">Cron Trigger</text>
    <rect x="280" y="94" width="180" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="370" y="124" fill="#78350f">Worker</text>
    <rect x="510" y="94" width="180" height="48" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="600" y="124" fill="#111827">GitHub API</text>
    <rect x="740" y="94" width="180" height="48" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="830" y="124" fill="#111827">GitHub Actions</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="140" y1="142" x2="140" y2="430"/>
    <line x1="370" y1="142" x2="370" y2="430"/>
    <line x1="600" y1="142" x2="600" y2="430"/>
    <line x1="830" y1="142" x2="830" y2="430"/>
  </g>

  <!-- 1 -->
  <path d="M140 184 L366 184" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="253" y="174" font-size="13" text-anchor="middle" fill="#111827">① 到点调用 scheduled()</text>
  <text x="253" y="202" font-size="11" text-anchor="middle" fill="#6b7280">按 UTC 计时</text>

  <!-- 2 -->
  <path d="M370 244 L596 244" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="485" y="234" font-size="13" text-anchor="middle" fill="#111827">② POST …/dispatches</text>
  <text x="485" y="262" font-size="11" text-anchor="middle" fill="#6b7280">Bearer Token + User-Agent</text>

  <!-- 3 -->
  <path d="M600 304 L374 304" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="485" y="294" font-size="13" text-anchor="middle" fill="#166534">③ 204 No Content</text>

  <!-- 4 -->
  <path d="M600 354 L826 354" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="715" y="344" font-size="13" text-anchor="middle" fill="#111827">④ 创建 workflow_dispatch 运行</text>

  <!-- 5 -->
  <rect x="820" y="374" width="20" height="50" fill="#d1d5db" stroke="#6b7280"/>
  <text x="810" y="404" font-size="13" text-anchor="end" fill="#111827">⑤ 拉代码、执行任务</text>

  <!-- 对比说明 -->
  <rect x="40" y="456" width="880" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="62" y="486" font-size="14" font-weight="600" fill="#7f1d1d">为什么不用 Actions 自带的 schedule？</text>
  <text x="62" y="512" font-size="13" fill="#991b1b">官方说明它是尽力而为：高负载时（尤其整点前后）会延迟，排队的任务甚至可能被直接丢弃。</text>
</svg>
