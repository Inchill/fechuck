<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#fafaf8"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#111827">托管平台怎么串起来</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">实线：网站访问路径　　虚线：定时任务路径</text>

  <!-- 代码仓库 -->
  <rect x="200" y="96" width="300" height="70" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="350" y="126" font-size="17" font-weight="600" text-anchor="middle" fill="#111827">GitHub 仓库</text>
  <text x="350" y="150" font-size="13" text-anchor="middle" fill="#4b5563">公开 / 私有 · git push</text>

  <!-- GitHub Actions -->
  <rect x="640" y="96" width="280" height="70" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="780" y="126" font-size="17" font-weight="600" text-anchor="middle" fill="#111827">GitHub Actions</text>
  <text x="780" y="150" font-size="13" text-anchor="middle" fill="#4b5563">真正执行任务的地方</text>

  <!-- 仓库 → 两个 Pages -->
  <path d="M280 166 L180 236" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M420 166 L520 236" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="196" y="200" font-size="12" fill="#6b7280" text-anchor="end">公开仓库</text>
  <text x="504" y="200" font-size="12" fill="#6b7280">私有仓库也行</text>

  <!-- GitHub Pages -->
  <rect x="40" y="240" width="280" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="272" font-size="17" font-weight="600" text-anchor="middle" fill="#1e3a8a">GitHub Pages</text>
  <text x="180" y="296" font-size="13" text-anchor="middle" fill="#1e40af">push 即部署 · 零配置</text>
  <text x="180" y="314" font-size="12" text-anchor="middle" fill="#3b5bab">用户名.github.io</text>

  <!-- Cloudflare Pages -->
  <rect x="380" y="240" width="280" height="84" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="520" y="272" font-size="17" font-weight="600" text-anchor="middle" fill="#7c2d12">Cloudflare Pages</text>
  <text x="520" y="296" font-size="13" text-anchor="middle" fill="#9a3412">自动构建 · 分支预览</text>
  <text x="520" y="314" font-size="12" text-anchor="middle" fill="#b45309">项目名.pages.dev</text>

  <!-- Workers -->
  <rect x="700" y="240" width="220" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="810" y="272" font-size="17" font-weight="600" text-anchor="middle" fill="#78350f">Cloudflare Workers</text>
  <text x="810" y="296" font-size="13" text-anchor="middle" fill="#92400e">Cron Trigger（UTC）</text>
  <text x="810" y="314" font-size="12" text-anchor="middle" fill="#a16207">不需要域名</text>

  <!-- Workers → Actions -->
  <path d="M810 240 L810 170" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arr-o)"/>
  <text x="822" y="210" font-size="12" fill="#b45309">workflow_dispatch</text>
  <text x="822" y="226" font-size="12" fill="#b45309">+ GitHub Token</text>
  <!-- Actions → 仓库 -->
  <path d="M640 131 L504 131" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arr-o)"/>
  <text x="572" y="122" font-size="12" text-anchor="middle" fill="#b45309">拉代码、跑任务</text>

  <!-- Pages → DNS -->
  <path d="M180 324 L180 392" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M520 324 L520 392" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- DNS -->
  <rect x="40" y="396" width="620" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="426" font-size="17" font-weight="600" text-anchor="middle" fill="#14532d">DNS 解析（域名在阿里云）</text>
  <text x="180" y="456" font-size="13" text-anchor="middle" fill="#166534">blog 子域名 CNAME</text>
  <text x="180" y="476" font-size="12" text-anchor="middle" fill="#15803d">→ 用户名.github.io</text>
  <text x="520" y="456" font-size="13" text-anchor="middle" fill="#166534">另一个子域名 CNAME</text>
  <text x="520" y="476" font-size="12" text-anchor="middle" fill="#15803d">→ 项目名.pages.dev</text>

  <!-- DNS → 访客 -->
  <path d="M350 488 L350 524" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 访客 -->
  <rect x="200" y="528" width="300" height="48" rx="24" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="350" y="558" font-size="15" font-weight="600" text-anchor="middle" fill="#111827">访客浏览器</text>

  <!-- 说明 -->
  <text x="700" y="420" font-size="13" fill="#4b5563">根域名（apex）：</text>
  <text x="700" y="442" font-size="12" fill="#6b7280">GitHub Pages 用 A 记录即可</text>
  <text x="700" y="462" font-size="12" fill="#6b7280">Cloudflare Pages 需要把 DNS</text>
  <text x="700" y="480" font-size="12" fill="#6b7280">托管到 Cloudflare</text>
</svg>
