<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-label="图表块晚到时，先显示固定高度的骨架屏，文字继续往下流，数据到了再回填到原位置" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif" font-size="12">
  <rect width="760" height="332" fill="#fafaf8"/>
  <text fill="#111827" x="24" y="32" font-size="15" font-weight="600">图表晚到：占位、继续出字、原位回填</text>

  <g font-size="12" font-weight="600" fill="#374151">
    <text x="24" y="64">① 收到 block_start</text>
    <text x="268" y="64">② 文字继续流</text>
    <text x="512" y="64">③ 收到 block_end</text>
  </g>

  <!-- 面板 -->
  <g fill="#ffffff" stroke="#e5e7eb" stroke-width="1.25">
    <rect x="24" y="76" width="224" height="212" rx="10"/>
    <rect x="268" y="76" width="224" height="212" rx="10"/>
    <rect x="512" y="76" width="224" height="212" rx="10"/>
  </g>

  <!-- 第一行文字（三格都有） -->
  <g fill="#9ca3af">
    <rect x="40" y="94" width="168" height="8" rx="4"/>
    <rect x="284" y="94" width="168" height="8" rx="4"/>
    <rect x="528" y="94" width="168" height="8" rx="4"/>
  </g>

  <!-- ① 骨架 -->
  <rect x="40" y="114" width="192" height="96" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <g fill="#e5e7eb">
    <rect x="52" y="126" width="80" height="8" rx="4"/>
    <rect x="60" y="178" width="22" height="22" rx="2"/>
    <rect x="94" y="164" width="22" height="36" rx="2"/>
    <rect x="128" y="172" width="22" height="28" rx="2"/>
    <rect x="162" y="184" width="22" height="16" rx="2"/>
    <rect x="196" y="188" width="22" height="12" rx="2"/>
  </g>
  <text fill="#6b7280" x="136" y="150" font-size="11" text-anchor="middle">chart · loading</text>

  <!-- ② 骨架 + 新文字 -->
  <rect x="284" y="114" width="192" height="96" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <g fill="#e5e7eb">
    <rect x="296" y="126" width="80" height="8" rx="4"/>
    <rect x="304" y="178" width="22" height="22" rx="2"/>
    <rect x="338" y="164" width="22" height="36" rx="2"/>
    <rect x="372" y="172" width="22" height="28" rx="2"/>
    <rect x="406" y="184" width="22" height="16" rx="2"/>
    <rect x="440" y="188" width="22" height="12" rx="2"/>
  </g>
  <text fill="#6b7280" x="380" y="150" font-size="11" text-anchor="middle">chart · loading</text>
  <g fill="#2563eb">
    <rect x="284" y="224" width="184" height="8" rx="4"/>
    <rect x="284" y="240" width="150" height="8" rx="4"/>
    <rect x="284" y="256" width="96" height="8" rx="4"/>
  </g>
  <text fill="#2563eb" x="476" y="276" font-size="10.5" text-anchor="end">新到的文字</text>

  <!-- ③ 图表回填 -->
  <rect x="528" y="114" width="192" height="96" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text fill="#111827" x="540" y="132" font-size="11" font-weight="600">Q3 区域销售额</text>
  <line x1="544" y1="200" x2="708" y2="200" stroke="#d1d5db"/>
  <g fill="#2563eb">
    <rect x="548" y="150" width="22" height="50" rx="2"/>
    <rect x="582" y="166" width="22" height="34" rx="2"/>
    <rect x="616" y="174" width="22" height="26" rx="2"/>
    <rect x="650" y="180" width="22" height="20" rx="2"/>
    <rect x="684" y="186" width="22" height="14" rx="2"/>
  </g>
  <g fill="#9ca3af">
    <rect x="528" y="224" width="184" height="8" rx="4"/>
    <rect x="528" y="240" width="150" height="8" rx="4"/>
    <rect x="528" y="256" width="96" height="8" rx="4"/>
  </g>

  <text fill="#6b7280" x="24" y="314" font-size="11.5">按 blockId 回填到原位置，不追加到末尾；骨架屏和图表高度一致，回填时页面不跳动</text>
</svg>
