<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="一条 AI 回复里同时出现文字、图表、查询语句、文件和表单五种块" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif" font-size="13">
  <rect width="760" height="600" fill="#fafaf8"/>

  <text fill="#111827" x="24" y="32" font-size="15" font-weight="600">一条 AI 回复，五种块</text>

  <!-- 对话框 -->
  <rect x="24" y="52" width="440" height="528" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.25"/>

  <!-- 用户提问 -->
  <rect x="236" y="68" width="212" height="32" rx="16" fill="#dbeafe"/>
  <text fill="#111827" x="342" y="89" text-anchor="middle">Q3 各区域销售怎么样？</text>

  <!-- 文本块 -->
  <text fill="#111827" x="40" y="126">Q3 各区域销售额如下，华东领先明显：</text>

  <!-- 图表块 -->
  <rect x="40" y="140" width="408" height="156" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.25"/>
  <text fill="#111827" x="56" y="162" font-size="12" font-weight="600">Q3 区域销售额（万元）</text>
  <line x1="64" y1="272" x2="432" y2="272" stroke="#d1d5db"/>
  <rect x="80" y="176" width="44" height="96" rx="3" fill="#2563eb"/>
  <rect x="152" y="208" width="44" height="64" rx="3" fill="#2563eb"/>
  <rect x="224" y="222" width="44" height="50" rx="3" fill="#2563eb"/>
  <rect x="296" y="234" width="44" height="38" rx="3" fill="#2563eb"/>
  <rect x="368" y="246" width="44" height="26" rx="3" fill="#2563eb"/>
  <g fill="#6b7280" font-size="11" text-anchor="middle">
    <text x="102" y="288">华东</text>
    <text x="174" y="288">华南</text>
    <text x="246" y="288">华北</text>
    <text x="318" y="288">西南</text>
    <text x="390" y="288">西北</text>
  </g>

  <!-- 查询语句块 -->
  <rect x="40" y="308" width="408" height="64" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.25"/>
  <text fill="#111827" x="56" y="331" font-size="12" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">status:500 | stats count() by path</text>
  <g font-size="11" text-anchor="middle">
    <rect x="56" y="345" width="44" height="18" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="78" y="358">复制</text>
    <rect x="108" y="345" width="64" height="18" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="140" y="358">执行查询</text>
    <rect x="180" y="345" width="100" height="18" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="230" y="358">在日志平台打开</text>
  </g>

  <!-- 文件块 -->
  <rect x="40" y="384" width="408" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.25"/>
  <rect x="56" y="394" width="32" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text fill="#166534" x="72" y="416" font-size="9.5" font-weight="700" text-anchor="middle">XLSX</text>
  <text fill="#111827" x="100" y="408" font-weight="600">Q3报表.xlsx</text>
  <text fill="#6b7280" x="100" y="427" font-size="11">471 KB · 可预览前 5 行</text>
  <g font-size="11" text-anchor="middle">
    <rect x="336" y="403" width="48" height="20" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="360" y="417">预览</text>
    <rect x="390" y="403" width="48" height="20" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="414" y="417">下载</text>
  </g>

  <!-- 表单块 -->
  <rect x="40" y="452" width="408" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.25"/>
  <text fill="#111827" x="56" y="474" font-weight="600">申请导出全量明细</text>
  <text fill="#374151" x="56" y="501" font-size="12">时间范围</text>
  <rect x="124" y="488" width="308" height="20" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text fill="#111827" x="132" y="502" font-size="11.5">2026-07-01 ~ 2026-09-30</text>
  <text fill="#374151" x="56" y="529" font-size="12">用途</text>
  <rect x="124" y="516" width="308" height="20" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text fill="#9ca3af" x="132" y="530" font-size="11.5">选填</text>
  <rect x="372" y="540" width="60" height="18" rx="4" fill="#2563eb"/>
  <text fill="#ffffff" x="402" y="553" font-size="11.5" text-anchor="middle">提交</text>

  <!-- 右侧标注 -->
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <path d="M300 122H488"/>
    <path d="M448 218H488"/>
    <path d="M448 340H488"/>
    <path d="M448 412H488"/>
    <path d="M448 508H488"/>
  </g>
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2563eb">
    <text x="496" y="118">text</text>
    <text x="496" y="214">chart</text>
    <text x="496" y="336">query</text>
    <text x="496" y="408">file</text>
    <text x="496" y="504">form</text>
  </g>
  <g fill="#6b7280" font-size="11.5">
    <text x="496" y="136">流式文本，逐字追加</text>
    <text x="496" y="232">后端取数，前端映射成 ECharts</text>
    <text x="496" y="354">带复制、执行、跳转等动作</text>
    <text x="496" y="426">SSE 只传引用：签名 URL + 预览</text>
    <text x="496" y="522">JSON Schema 描述字段</text>
    <text x="496" y="538">提交走单独的 action 接口</text>
  </g>
</svg>
