<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="交互块的动作分三种去向：api 直接调业务接口，prompt 转成用户消息交给模型，link 由前端直接打开" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif" font-size="12.5">
  <defs>
    <marker id="act-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#4b5563" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect width="760" height="352" fill="#fafaf8"/>
  <text fill="#111827" x="24" y="32" font-size="15" font-weight="600">交互块的回传通道</text>

  <!-- 交互块 -->
  <rect x="24" y="96" width="176" height="128" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text fill="#111827" x="40" y="120" font-weight="600">卡片 / 表单块</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="40" y="134" width="144" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text fill="#1e3a8a" x="112" y="149">提交申请（api）</text>
    <rect x="40" y="162" width="144" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text fill="#4c1d95" x="112" y="177">展开华东明细（prompt）</text>
    <rect x="40" y="190" width="144" height="22" rx="4" fill="#f3f4f6" stroke="#9ca3af"/>
    <text fill="#374151" x="112" y="205">在日志平台打开（link）</text>
  </g>

  <!-- 路由 -->
  <path d="M200 160H252" stroke="#4b5563" stroke-width="1.25" fill="none" marker-end="url(#act-arrow)"/>
  <rect x="256" y="104" width="188" height="112" rx="10" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text fill="#111827" x="350" y="128" text-anchor="middle" font-weight="600">POST /chat/actions</text>
  <text fill="#6b7280" x="350" y="150" text-anchor="middle" font-size="11" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">msgId · blockId · actionId</text>
  <text fill="#6b7280" x="350" y="166" text-anchor="middle" font-size="11" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">payload · idempotencyKey</text>
  <line x1="272" y1="180" x2="428" y2="180" stroke="#e5e7eb"/>
  <text fill="#374151" x="350" y="201" text-anchor="middle" font-size="11.5">鉴权 · 重新校验 · 幂等 · 落状态</text>

  <!-- 分支 -->
  <path d="M444 136H468V112H492" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#act-arrow)"/>
  <path d="M444 184H468V208H492" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#act-arrow)"/>

  <rect x="496" y="72" width="240" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text fill="#1e3a8a" x="512" y="96" font-weight="600" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">kind: api</text>
  <text fill="#111827" x="512" y="118" font-size="12">直接调业务接口，不经过模型</text>
  <text fill="#6b7280" x="512" y="138" font-size="11.5">返回：更新这个块的 state，或追加新块</text>

  <rect x="496" y="168" width="240" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text fill="#4c1d95" x="512" y="192" font-weight="600" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">kind: prompt</text>
  <text fill="#111827" x="512" y="214" font-size="12">转成一条用户消息，开启新一轮对话</text>
  <text fill="#6b7280" x="512" y="234" font-size="11.5">返回：模型的回复照常走 SSE</text>

  <!-- link -->
  <path d="M112 224V268" stroke="#9ca3af" stroke-width="1.25" stroke-dasharray="4 3" fill="none" marker-end="url(#act-arrow)"/>
  <rect x="24" y="272" width="176" height="56" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
  <text fill="#374151" x="40" y="295" font-weight="600" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">kind: link</text>
  <text fill="#6b7280" x="40" y="315" font-size="11.5">前端直接打开，不回后端</text>

  <text fill="#6b7280" x="256" y="296" font-size="11.5">有副作用的 api 动作在前端先二次确认；</text>
  <text fill="#6b7280" x="256" y="316" font-size="11.5">能出现哪些动作由后端白名单决定，模型只能从中挑选。</text>
</svg>
