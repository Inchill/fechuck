<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="改造前是一段文本流交给 Markdown 渲染，改造后是带类型的事件流，由 reducer 合并成块数组" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif" font-size="13">
  <defs>
    <marker id="tvb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#6b7280" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafaf8"/>
  <text fill="#111827" x="24" y="32" font-size="15" font-weight="600">从文本流到块流</text>

  <!-- 改造前 -->
  <text fill="#6b7280" x="24" y="64" font-size="12">改造前：SSE 里只有文本</text>
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5">
    <rect x="24" y="76" width="240" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="34" y="91">data: {"delta":"Q3 各区域"}</text>
    <rect x="24" y="102" width="240" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="34" y="117">data: {"delta":"销售额如下"}</text>
    <rect x="24" y="128" width="240" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="34" y="143">data: {"delta":"| 区域 | 金额 |"}</text>
  </g>
  <path d="M264 113H316" stroke="#6b7280" stroke-width="1.25" fill="none" marker-end="url(#tvb-arrow)"/>
  <rect x="320" y="90" width="140" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text fill="#111827" x="390" y="118" text-anchor="middle" font-weight="600">Markdown 渲染</text>
  <path d="M460 113H512" stroke="#6b7280" stroke-width="1.25" fill="none" marker-end="url(#tvb-arrow)"/>
  <rect x="516" y="76" width="220" height="74" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.25"/>
  <text fill="#111827" x="626" y="104" text-anchor="middle" font-weight="600">一整段富文本</text>
  <text fill="#6b7280" x="626" y="124" text-anchor="middle" font-size="11.5">图表只能退化成表格或图片</text>
  <text fill="#6b7280" x="626" y="140" text-anchor="middle" font-size="11.5">交互全靠模型拼 Markdown</text>

  <line x1="24" y1="176" x2="736" y2="176" stroke="#e5e7eb"/>

  <!-- 改造后 -->
  <text fill="#6b7280" x="24" y="204" font-size="12">改造后：每个事件都带类型和 blockId</text>
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5">
    <rect x="24" y="216" width="240" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="34" y="231">text_delta   b1 "Q3 各区域…"</text>
    <rect x="24" y="242" width="240" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text fill="#1e3a8a" x="34" y="257">block_start  b2 chart</text>
    <rect x="24" y="268" width="240" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="34" y="283">text_delta   b3 "华东领先…"</text>
    <rect x="24" y="294" width="240" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text fill="#1e3a8a" x="34" y="309">block_end    b2 {spec}</text>
    <rect x="24" y="320" width="240" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text fill="#78350f" x="34" y="335">block_start  b4 file</text>
    <rect x="24" y="346" width="240" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text fill="#78350f" x="34" y="361">block_end    b4 {asset}</text>
    <rect x="24" y="372" width="240" height="22" rx="4" fill="#ffffff" stroke="#d1d5db"/>
    <text fill="#374151" x="34" y="387">done</text>
  </g>
  <path d="M264 305H316" stroke="#6b7280" stroke-width="1.25" fill="none" marker-end="url(#tvb-arrow)"/>
  <rect x="320" y="276" width="140" height="58" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text fill="#111827" x="390" y="300" text-anchor="middle" font-weight="600">reducer</text>
  <text fill="#6b7280" x="390" y="320" text-anchor="middle" font-size="11.5">按 blockId 合并</text>
  <path d="M460 305H512" stroke="#6b7280" stroke-width="1.25" fill="none" marker-end="url(#tvb-arrow)"/>

  <text fill="#6b7280" x="516" y="226" font-size="11.5">message.blocks</text>
  <rect x="516" y="236" width="220" height="30" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text fill="#111827" x="530" y="256">text</text>
  <text fill="#6b7280" x="722" y="256" text-anchor="end" font-size="11.5">TextBlock</text>
  <rect x="516" y="272" width="220" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text fill="#1e3a8a" x="530" y="292">chart</text>
  <text fill="#1e3a8a" x="722" y="292" text-anchor="end" font-size="11.5">ChartBlock</text>
  <rect x="516" y="308" width="220" height="30" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text fill="#111827" x="530" y="328">text</text>
  <text fill="#6b7280" x="722" y="328" text-anchor="end" font-size="11.5">TextBlock</text>
  <rect x="516" y="344" width="220" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text fill="#78350f" x="530" y="364">file</text>
  <text fill="#78350f" x="722" y="364" text-anchor="end" font-size="11.5">FileBlock</text>
</svg>
