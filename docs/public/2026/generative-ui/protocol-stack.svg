<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-label="协议分层：MCP 连接工具和数据，A2A 连接其他 Agent，AG-UI 连接 Agent 和前端应用，A2UI、Open-JSON-UI、MCP Apps 是在 AG-UI 上传输的 UI 载荷" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans CJK TC','Microsoft YaHei',sans-serif" font-size="12.5">
  <defs>
    <marker id="ps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#4b5563" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect width="760" height="384" fill="#fafaf8"/>
  <text fill="#111827" x="24" y="32" font-size="15" font-weight="600">几个协议各管一段</text>

  <!-- 前端 -->
  <rect x="24" y="52" width="712" height="88" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text fill="#111827" x="40" y="88" font-weight="600" font-size="14">前端应用</text>
  <text fill="#6b7280" x="40" y="108" font-size="11">Web / 小程序 / App</text>
  <g stroke-width="1.25">
    <rect x="176" y="68" width="172" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="364" y="68" width="172" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="552" y="68" width="172" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g text-anchor="middle">
    <text fill="#1e3a8a" x="262" y="92" font-weight="600">自有组件</text>
    <text fill="#1e3a8a" x="262" y="112" font-size="11">受控型 · 按类型注册</text>
    <text fill="#4c1d95" x="450" y="92" font-weight="600">组件目录 + 渲染器</text>
    <text fill="#4c1d95" x="450" y="112" font-size="11">声明式 · A2UI 等</text>
    <text fill="#78350f" x="638" y="92" font-weight="600">iframe 沙箱</text>
    <text fill="#78350f" x="638" y="112" font-size="11">开放式 · MCP Apps</text>
  </g>

  <path d="M380 140V156M380 222V238" stroke="#6b7280" stroke-width="2" fill="none"/>

  <!-- AG-UI -->
  <rect x="24" y="156" width="712" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text fill="#1e3a8a" x="40" y="182" font-weight="700" font-size="14">AG-UI</text>
  <text fill="#1e3a8a" x="40" y="202" font-size="11">Agent ↔ 应用的事件流，常走 SSE</text>
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="10.5">
    <rect x="236" y="170" width="132" height="20" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text fill="#1e3a8a" x="302" y="184" text-anchor="middle">TEXT_MESSAGE_*</text>
    <rect x="376" y="170" width="108" height="20" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text fill="#1e3a8a" x="430" y="184" text-anchor="middle">TOOL_CALL_*</text>
    <rect x="492" y="170" width="116" height="20" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text fill="#1e3a8a" x="550" y="184" text-anchor="middle">STATE_DELTA</text>
    <rect x="616" y="170" width="104" height="20" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text fill="#1e3a8a" x="668" y="184" text-anchor="middle">CUSTOM</text>
    <rect x="236" y="196" width="226" height="20" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
    <text fill="#4c1d95" x="349" y="210" text-anchor="middle">A2UI / Open-JSON-UI 消息</text>
    <rect x="470" y="196" width="160" height="20" rx="10" fill="#ffffff" stroke="#fcd34d"/>
    <text fill="#78350f" x="550" y="210" text-anchor="middle">MCP Apps 资源</text>
  </g>

  <!-- Agent -->
  <rect x="232" y="238" width="296" height="48" rx="10" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text fill="#111827" x="380" y="267" text-anchor="middle" font-weight="600">Agent / 编排服务</text>

  <path d="M300 286V302H189V324" stroke="#4b5563" stroke-width="1.25" fill="none" marker-end="url(#ps-arrow)"/>
  <path d="M460 286V302H571V324" stroke="#4b5563" stroke-width="1.25" fill="none" marker-end="url(#ps-arrow)"/>

  <rect x="24" y="328" width="330" height="44" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text fill="#111827" x="40" y="355"><tspan font-weight="700">MCP</tspan>：连接工具和数据（业务接口、数据库）</text>
  <rect x="406" y="328" width="330" height="44" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text fill="#111827" x="422" y="355"><tspan font-weight="700">A2A</tspan>：连接其他 Agent</text>
</svg>
