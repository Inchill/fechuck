# 构建 VitePress 站点并将其部署到 GitHub Pages 的示例工作流程
#
name: Deploy VitePress site to Pages

on:
  # 在针对 `main` 分支的推送上运行。如果你
  # 使用 `master` 分支作为默认分支，请将其更改为 `master`
  push:
    branches: [master]

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: write # 需要把生成的朗读音频推到 tts-audio 分支
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      - uses: pnpm/action-setup@v6 # 如果使用 pnpm，请取消注释
      # - uses: oven-sh/setup-bun@v1 # 如果使用 Bun，请取消注释
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm # 或 pnpm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install CJK fonts # 生成分享卡片图片（docs/.vitepress/og.mts）需要中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: pnpm install # 或 pnpm install / yarn install / bun install
      - name: Fetch bookmark icons
        continue-on-error: true # 抓不到的图标页面上会显示首字母，不影响部署
        run: pnpm favicons
      - name: Build with VitePress
        run: pnpm docs:build # 或 pnpm docs:build / yarn docs:build / bun run docs:build

      # ---------- 文章朗读音频（scripts/tts.mjs）----------
      # 已生成的音频存在 tts-audio 分支（只保留最新一份，不累积历史），每次部署只补新增或改动的段落
      - name: Restore TTS audio
        run: |
          mkdir -p docs/public/tts
          if git ls-remote --exit-code --heads origin tts-audio > /dev/null; then
            git fetch --depth=1 origin tts-audio
            git archive FETCH_HEAD | tar -x -C docs/public/tts
          fi
      - name: Install edge-tts and ffmpeg
        run: |
          pipx install edge-tts
          command -v ffmpeg || sudo apt-get install -y ffmpeg
      - name: Generate TTS audio
        continue-on-error: true # 语音接口出问题也照常部署，页面会退回浏览器自带的声音
        run: pnpm tts
      - name: Save TTS audio to tts-audio branch
        if: github.ref == 'refs/heads/master'
        run: |
          cd docs/public/tts
          [ -n "$(ls -A)" ] || exit 0
          git init -q -b tts-audio
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "chore: 更新朗读音频"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tts-audio
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5